version: "3.9"

services:

  redis:
    image: redis:7.2-alpine
    container_name: talenthub-redis
    ports:
      - "6379:6379"
    volumes:
      - talenthub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mariadb-main:
    image: mariadb:11.2
    container_name: talenthub-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: talenthub_db
    ports:
      - "3306:3306"
    volumes:
      - talenthub-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb-stats:
    image: mariadb:11.2
    container_name: talenthub-stats-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: talenthub_stats_db
    ports:
      - "3307:3306"
    volumes:
      - talenthub-stats-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  stats-svc:
    build: ./stats-svc
    container_name: talenthub-stats-svc
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-stats:3306/talenthub_stats_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mariadb-stats:
        condition: service_healthy
      redis:
        condition: service_healthy

  main-app:
    build: ./main-app
    container_name: talenthub-main-app
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-main:3306/talenthub_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      STATS_SVC_URL: http://stats-svc:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-TalentHub-Default-Secret-Key-2026-Must-Be-256-Bits-Long!!}
    depends_on:
      mariadb-main:
        condition: service_healthy
      redis:
        condition: service_healthy
      stats-svc:
        condition: service_started

volumes:
  talenthub-db-data:
  talenthub-stats-db-data:
  talenthub-redis-data:

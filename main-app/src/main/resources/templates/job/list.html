<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Browse Jobs')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="page">
    <div class="page-header">
        <div class="label" th:text="#{jobs.browse.label}">Open positions</div>
        <h1 th:text="#{jobs.browse.title}">Browse Jobs</h1>
    </div>

    <div class="stat-grid" th:unless="${#lists.isEmpty(stats)}">
        <div class="stat-card" th:each="s : ${stats}">
            <div class="number" th:text="${s.totalJobPosts}">0</div>
            <div class="label-text" th:text="${s.category}">CATEGORY</div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(jobs)}" class="empty-state" th:text="#{jobs.browse.empty}">No open jobs right now.</div>

    <div class="card-grid" th:unless="${#lists.isEmpty(jobs)}">
        <div class="card" th:each="job : ${jobs}">
            <span class="badge badge-open">Open</span>
            <h3 th:text="${job.title}">Title</h3>
            <p class="meta" th:text="${#strings.abbreviate(job.description, 100)}">Description</p>
            <div class="card-footer">
                <span style="font-weight:700; color:var(--accent);">$<span th:text="${job.budget}">0</span></span>
                <a class="btn btn-outline btn-small" th:href="@{/jobs/{id}(id=${job.id})}">View</a>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>

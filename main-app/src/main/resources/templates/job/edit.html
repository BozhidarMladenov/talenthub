<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Job')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="page-narrow">
    <div class="page-header">
        <div class="label">Edit job post</div>
        <h1>Update Job</h1>
    </div>
    <form class="form-card" th:action="@{/jobs/{id}/edit(id=${jobId})}" th:object="${jobPostRequest}" method="post">
        <div class="form-group">
            <label for="title" th:text="#{job.create.titleField}">Title</label>
            <input type="text" id="title" th:field="*{title}"/>
            <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>
        <div class="form-group">
            <label for="category" th:text="#{job.create.category}">Category</label>
            <select id="category" th:field="*{category}">
                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
            </select>
            <div class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>
        <div class="form-group">
            <label for="description" th:text="#{job.create.description}">Description</label>
            <textarea id="description" th:field="*{description}"></textarea>
            <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>
        <div class="form-group">
            <label for="budget" th:text="#{job.create.budget}">Budget ($)</label>
            <input type="number" step="0.01" id="budget" th:field="*{budget}"/>
            <div class="field-error" th:if="${#fields.hasErrors('budget')}" th:errors="*{budget}"></div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a class="btn btn-secondary" th:href="@{/jobs/{id}(id=${jobId})}" th:text="#{job.create.cancel}">Cancel</a>
        </div>
    </form>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Apply')}" ></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="page-narrow">
    <div class="page-header">
        <div class="label">Apply for job</div>
        <h1 th:text="${job.title}">Job Title</h1>
        <p style="color:var(--ink-soft);">Budget: $<span th:text="${job.budget}">0</span></p>
    </div>
    <form class="form-card" th:action="@{/applications/apply/{id}(id=${job.id})}"
          th:object="${applicationRequest}" method="post">
        <div class="form-group">
            <label for="coverLetter">Cover letter</label>
            <textarea id="coverLetter" th:field="*{coverLetter}"
                      placeholder="Describe your experience and why you're a good fit..."></textarea>
            <div class="field-error" th:if="${#fields.hasErrors('coverLetter')}" th:errors="*{coverLetter}"></div>
        </div>
        <div class="form-group">
            <label for="proposedRate">Your rate ($)</label>
            <input type="number" step="0.01" id="proposedRate" th:field="*{proposedRate}"/>
            <div class="field-error" th:if="${#fields.hasErrors('proposedRate')}" th:errors="*{proposedRate}"></div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Submit Application</button>
            <a class="btn btn-secondary" th:href="@{/jobs/{id}(id=${job.id})}"
               th:text="#{job.create.cancel}">Cancel</a>
        </div>
    </form>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign Up')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="page-narrow">
    <div class="page-header">
        <div class="label" th:text="#{auth.register.label}">Create account</div>
        <h1 th:text="#{auth.register.title}">Join TalentHub</h1>
    </div>
    <form class="form-card" th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
        <div class="form-group">
            <label for="username" th:text="#{auth.register.username}">Username</label>
            <input type="text" id="username" th:field="*{username}" autocomplete="username"/>
            <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>
        <div class="form-group">
            <label for="email" th:text="#{auth.register.email}">Email</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="email"/>
            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="form-group">
            <label for="fullName" th:text="#{auth.register.fullName}">Full name</label>
            <input type="text" id="fullName" th:field="*{fullName}" autocomplete="name"/>
            <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="password" th:text="#{auth.register.password}">Password</label>
                <input type="password" id="password" th:field="*{password}" autocomplete="new-password"/>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="form-group">
                <label for="confirmPassword" th:text="#{auth.register.confirmPassword}">Confirm password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password"/>
                <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>
        </div>
        <div class="form-group">
            <label th:text="#{auth.register.role}">I am a&#8230;</label>
            <div class="radio-options">
                <label th:each="r : ${roles}">
                    <input type="radio" th:field="*{role}" th:value="${r}"/>
                    <span th:text="${r.name() == 'FREELANCER'} ? #{auth.register.freelancer} : #{auth.register.client}">Role</span>
                </label>
            </div>
            <div class="field-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary" th:text="#{auth.register.submit}">Create account</button>
        </div>
        <p class="helper">
            <span th:text="#{auth.register.login}">Already have an account?</span>
            <a th:href="@{/auth/login}" th:text="#{nav.login}">Log in</a>
        </p>
    </form>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>

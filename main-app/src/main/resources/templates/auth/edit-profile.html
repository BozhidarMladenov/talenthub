<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Profile')}"></head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main class="page-narrow">
    <div class="page-header">
        <h1>Edit Profile</h1>
    </div>
    <form class="form-card" th:action="@{/profile/edit}" th:object="${profileUpdateRequest}" method="post">
        <div class="form-group">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" th:field="*{fullName}"/>
            <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" th:field="*{bio}" placeholder="Tell clients or freelancers about yourself..."></textarea>
            <div class="field-error" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}"></div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a class="btn btn-secondary" th:href="@{/profile}">Cancel</a>
        </div>
    </form>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>

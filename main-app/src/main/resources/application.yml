server:
  port: 8080

spring:
  application:
    name: talenthub-main

  datasource:
    url: jdbc:mariadb://localhost:3306/talenthub_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
    open-in-view: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false

  web:
    resources:
      cache:
        period: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  messages:
    basename: i18n/messages
    encoding: UTF-8

stats-svc:
  url: ${STATS_SVC_URL:http://localhost:8081}

jwt:
  secret: ${JWT_SECRET:TalentHub-Default-Secret-Key-2026-Must-Be-256-Bits-Long!!}
  expiration-ms: 86400000

logging:
  level:
    com.softuni.talenthub: DEBUG
